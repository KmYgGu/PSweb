<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>픽셀 오토 배틀</title>
<link rel="stylesheet" href="css/style.css?v=2026.11.14-19">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="720" height="1280"></canvas>

    <!-- 전투 상단 UI -->
    <div id="hud" class="hidden">
      <div class="frame" id="f0">
        <div class="pf"><img alt=""></div>
        <div class="info">
          <div class="nm"></div>
          <div class="hpbar"><div class="lag"></div><div class="fill"></div></div><div class="resbars"></div>
          <div class="hpnum"></div>
        </div>
      </div>
      <div class="vs"><b>VS</b><span id="timer">0.0</span></div>
      <div class="frame right" id="f1">
        <div class="pf"><img alt=""></div>
        <div class="info">
          <div class="nm"></div>
          <div class="hpbar"><div class="lag"></div><div class="fill"></div></div><div class="resbars"></div>
          <div class="hpnum"></div>
        </div>
      </div>
    </div>

    <canvas id="cvTop" width="720" height="1280"></canvas>

    <!-- 전투 하단 UI -->
    <div id="bottom" class="hidden">
      <div id="log"></div>
      <div id="speed">
        <span id="stageName" class="stg"></span><span class="lbl">배속</span>
        <button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
        <button id="mute" type="button">소리</button>
      </div>
    </div>

    <!-- 리플레이 뷰어 -->
    <div id="rpTop" class="hidden"><span class="rpbadge">● 리플레이</span><span id="rpWarn"></span></div>
    <div id="rpBar" class="hidden">
      <span id="rpTime">0:00.0 / 0:00.0</span>
      <div id="rpScrub"><div class="trk"><div id="rpFill"></div></div><div id="rpMarks"></div><div id="rpHead"></div></div>
    </div>
    <div id="rpCtl" class="hidden">
      <button id="rpBack" title="처음으로">⏮</button><button id="rpPlay" title="재생/일시정지">▶</button>
      <button data-rs="0.5">0.5x</button><button data-rs="1" class="on">1x</button><button data-rs="2">2x</button>
      <button id="rpHl" class="hl" title="최고의 플레이">★</button><button id="rpA" title="구간 시작">A</button><button id="rpB" title="구간 끝">B</button>
      <button id="rpSv" title="저장">저장</button><button id="rpX" title="닫기">✕</button>
    </div>
    <div id="rpSave" class="hidden">
      <div class="rsh">리플레이 저장 (.psreplay)</div>
      <button id="rpSvHl">★ 하이라이트 구간</button>
      <button id="rpSvSeg">A~B 구간</button>
      <button id="rpSvFull">전체 경기</button>
      <div class="rsh">🎬 동영상 저장 (실시간 녹화) <span id="vidFmt" class="vfmt">형식: WEBM</span></div>
      <label class="vaud"><input type="checkbox" id="vidAudio" checked> 소리 포함</label>
      <div class="vrow"><button id="vidHl">★ 하이라이트</button><button id="vidSeg">A~B</button><button id="vidFull">전체</button></div>
      <button id="vidPick" class="vpick">📁 assets 폴더에서 읽기</button>
    </div>
    <div id="vidRec" class="hidden"><div id="vidTxt">🎬 녹화 중</div><div class="vtrk"><div id="vidBar"></div></div><button id="vidCancel">취소</button></div>
    <div id="vidDlg" class="hidden"><div class="vbox"><div id="vidDlgTxt"></div><button id="vidDlgDir">📁 assets 폴더 선택</button><button id="vidDlgGo">그대로 녹화</button><button id="vidDlgNo">취소</button></div></div>
    <input id="vidDir" type="file" webkitdirectory directory multiple hidden>
    <div id="rpBanner" class="hidden"><div class="rpbt" id="rpBTitle">최고의 플레이</div><img id="rpBImg" alt=""><div class="rpbn" id="rpBName"></div><div class="rpbw" id="rpBWhy"></div></div>
    <div id="rpToast" class="hidden"></div>

    <!-- 캐릭터 선택 -->
    <div id="select">
      <h1>픽셀 오토 배틀<span id="appVer" class="appver"></span></h1>
      <div class="modesel" id="modeSel">
        <button type="button" class="swlab" data-m="A">A타입</button>
        <button type="button" class="switch" id="modeSw" role="switch" aria-checked="false" aria-label="전투 타입"><span class="knob"></span></button>
        <button type="button" class="swlab" data-m="B">B타입</button>
      </div>
      <div class="slots">
        <div class="slot p0 active" data-slot="0"></div>
        <div class="slot p1" data-slot="1"></div>
      </div>
      <div class="hint" id="hint">P1 캐릭터를 고르세요</div>
      <div class="grid" id="grid"></div>
      <div class="btns">
        <button id="rnd" class="sub">랜덤</button>
        <button id="start" class="main" disabled>전투 시작</button>
      </div>
      <div class="extrabtns" id="extraBtns"><button id="rpLoad" class="rpload" type="button">📂 리플레이 열기</button><button id="setOpen" class="rpload" type="button">⚙ 설정</button></div><input id="rpFile" type="file" accept=".psreplay,.json,application/json" hidden>
    </div>

    <!-- 스테이지 선택 -->
    <div id="stageSel" class="hidden">
      <h1>스테이지 선택</h1>
      <div class="vsline" id="vsline"></div>
      <div class="modesel" id="focusSel">
        <span class="swtitle">경기 집중 모드</span>
        <button type="button" class="switch" id="focusSw" role="switch" aria-checked="false" aria-label="경기 집중 모드"><span class="knob"></span></button>
      </div>
      <div class="modesel" id="directSel">
        <span class="swtitle">직접 플레이 모드</span>
        <button type="button" class="switch" id="directSw" role="switch" aria-checked="false" aria-label="직접 플레이 모드"><span class="knob"></span></button>
      </div>
      <div class="sgrid" id="sgrid"></div>
      <div class="btns"><button id="sback" class="sub">뒤로</button></div>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden">
      <div class="box">
        <img id="winImg" alt="">
        <div id="winTxt"></div>
        <div id="winSub"></div>
        <button id="again" class="main">다시 싸우기</button>
        <button id="reselect" class="sub">다시 고르기</button>
        <div class="rprow"><button id="rpOpen" class="sub">▶ 리플레이</button><button id="rpPotg" class="sub">★ 최고의 플레이</button></div>
        <button id="logBtn" class="sub">전투 로그</button>
      </div>
    </div>

    <!-- 전체 전투 로그 -->
    <div id="fullLog" class="hidden">
      <div class="flbox">
        <div class="flhead"><b>전투 로그</b><span id="flCount"></span><button id="flCopy" type="button">복사</button><button id="flClose" type="button">닫기</button></div>
        <div id="flList"></div>
      </div>
    </div>

    <!-- 설정 (js/settings.js: 옵션 줄은 Settings.define 으로 자동 생성) -->
    <div id="settings" class="hidden"><div class="setbox"><div class="sethead"><b>⚙ 설정</b><button id="setClose" type="button">닫기</button></div><div id="setList"></div></div></div>

    <div id="modeTip" role="tooltip" aria-hidden="true"><div class="tipbody"></div><i class="tiptail"></i></div>
  </div>
</div>
