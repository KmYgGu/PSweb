<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>픽셀 오토 배틀</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="cv" width="720" height="1280"></canvas>

    <!-- 전투 상단 UI -->
    <div id="hud" class="hidden">
      <div class="frame" id="f0">
        <div class="pf"><img alt=""></div>
        <div class="info">
          <div class="nm"></div>
          <div class="hpbar"><div class="lag"></div><div class="fill"></div></div><div class="resbars"></div>
          <div class="hpnum"></div>
        </div>
      </div>
      <div class="vs"><b>VS</b><span id="timer">0.0</span></div>
      <div class="frame right" id="f1">
        <div class="pf"><img alt=""></div>
        <div class="info">
          <div class="nm"></div>
          <div class="hpbar"><div class="lag"></div><div class="fill"></div></div><div class="resbars"></div>
          <div class="hpnum"></div>
        </div>
      </div>
    </div>

    <canvas id="cvTop" width="720" height="1280"></canvas>

    <!-- 전투 하단 UI -->
    <div id="bottom" class="hidden">
      <div id="log"></div>
      <div id="speed">
        <span id="stageName" class="stg"></span><span class="lbl">배속</span>
        <button data-s="0.5">0.5x</button><button data-s="1" class="on">1x</button><button data-s="2">2x</button><button data-s="4">4x</button>
        <button id="mute" type="button">소리</button>
      </div>
    </div>

    <!-- 리플레이 뷰어 -->
    <div id="rpTop" class="hidden"><span class="rpbadge">● 리플레이</span><span id="rpWarn"></span></div>
    <div id="rpBar" class="hidden">
      <span id="rpTime">0:00.0 / 0:00.0</span>
      <div id="rpScrub"><div class="trk"><div id="rpFill"></div></div><div id="rpMarks"></div><div id="rpHead"></div></div>
    </div>
    <div id="rpCtl" class="hidden">
      <button id="rpBack" title="처음으로">⏮</button><button id="rpPlay" title="재생/일시정지">▶</button>
      <button data-rs="0.5">0.5x</button><button data-rs="1" class="on">1x</button><button data-rs="2">2x</button>
      <button id="rpHl" class="hl" title="최고의 플레이">★</button><button id="rpA" title="구간 시작">A</button><button id="rpB" title="구간 끝">B</button>
      <button id="rpSv" title="저장">저장</button><button id="rpX" title="닫기">✕</button>
    </div>
    <div id="rpSave" class="hidden">
      <div class="rsh">리플레이 저장 (.psreplay)</div>
      <button id="rpSvHl">★ 하이라이트 구간</button>
      <button id="rpSvSeg">A~B 구간</button>
      <button id="rpSvFull">전체 경기</button>
    </div>
    <div id="rpBanner" class="hidden"><div class="rpbt" id="rpBTitle">최고의 플레이</div><img id="rpBImg" alt=""><div class="rpbn" id="rpBName"></div><div class="rpbw" id="rpBWhy"></div></div>
    <div id="rpToast" class="hidden"></div>

    <!-- 캐릭터 선택 -->
    <div id="select">
      <h1>픽셀 오토 배틀</h1>
      <div class="slots">
        <div class="slot p0 active" data-slot="0"></div>
        <div class="slot p1" data-slot="1"></div>
      </div>
      <div class="hint" id="hint">P1 캐릭터를 고르세요</div>
      <div class="grid" id="grid"></div>
      <div class="btns">
        <button id="rnd" class="sub">랜덤</button>
        <button id="start" class="main" disabled>전투 시작</button>
      </div>
      <button id="rpLoad" class="rpload" type="button">📂 리플레이 열기</button><input id="rpFile" type="file" accept=".psreplay,.json,application/json" hidden>
    </div>

    <!-- 스테이지 선택 -->
    <div id="stageSel" class="hidden">
      <h1>스테이지 선택</h1>
      <div class="vsline" id="vsline"></div>
      <div class="sgrid" id="sgrid"></div>
      <div class="btns"><button id="sback" class="sub">뒤로</button></div>
    </div>

    <!-- 결과 -->
    <div id="result" class="hidden">
      <div class="box">
        <img id="winImg" alt="">
        <div id="winTxt"></div>
        <div id="winSub"></div>
        <button id="again" class="main">다시 싸우기</button>
        <button id="reselect" class="sub">다시 고르기</button>
        <div class="rprow"><button id="rpOpen" class="sub">▶ 리플레이</button><button id="rpPotg" class="sub">★ 최고의 플레이</button></div>
        <button id="logBtn" class="sub">전투 로그</button>
      </div>
    </div>

    <!-- 전체 전투 로그 -->
    <div id="fullLog" class="hidden">
      <div class="flbox">
        <div class="flhead"><b>전투 로그</b><span id="flCount"></span><button id="flCopy" type="button">복사</button><button id="flClose" type="button">닫기</button></div>
        <div id="flList"></div>
      </div>
    </div>
  </div>
</div>
<script src="js/characters.js"></script>
<script src="js/elements.js"></script>
<script src="js/stages.js"></script>
<script src="js/status.js"></script>
<script src="js/skills.js"></script>
<script src="js/kidomusha.js"></script>
<script src="js/duck.js"></script>
<script src="js/mystic.js"></script>
<script src="js/skills2.js"></script>
<script src="js/galford.js"></script>
<script src="js/blade.js"></script>
<script src="js/broly.js"></script>
<script src="js/cards.js"></script>
<script src="js/duel_sprites.js"></script>
<script src="js/kaiba_sprites.js"></script>
<script src="js/duel.js"></script>
<script src="js/kaiba.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sfxdata.js"></script>
  <script src="js/sfx.js"></script>
<script src="js/game.js"></script>
<script src="js/stages2.js"></script>
<script src="js/stages3.js"></script>
<script src="js/stages4.js"></script>
<script src="js/stages5.js"></script>
<script src="js/stages6.js"></script>
<script src="js/ghoul.js"></script>
<script src="js/main.js"></script>
</body>
</html>
